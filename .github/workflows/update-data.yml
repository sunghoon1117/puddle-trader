name: 자동 갱신 + 배포
# PC·Claude 없이 동작: GitHub 가 시세(5분마다·미국 장중)와 거물 거래(30분마다)를 수집해 GitHub Pages 에 배포합니다.
# 비밀 값(SEC 연락처, FMP 키)은 저장소 Settings → Secrets 에만 두며 사이트/코드에는 포함되지 않습니다.
on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'     # 시세만(최단 주기 5분, GitHub 지연 가능)
    - cron: '7,37 12-23 * * 1-5'    # 시세 + 거물 거래(SEC·13F·의원)
    - cron: '0 6 * * *'             # 하루 한 번 전체 재수집
  workflow_dispatch:
    inputs:
      video:
        description: '(선택) 바로 분석할 유튜브 영상 주소 또는 ID — 휴대폰에서 붙여넣기'
        required: false
        default: ''
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 시세·재무 수집 (실패 종목은 기존 값 유지)
        run: python tools/update_data.py --full
      - name: 거물 거래 수집 (SEC 가 제한하면 우회하지 않고 이전 데이터 유지)
        if: github.event_name != 'schedule' || github.event.schedule != '*/5 13-21 * * 1-5'
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python tools/tracker_collect.py
      - name: 경제 일정 수집 (연준·노동통계국 공식 일정)
        if: github.event_name != 'schedule' || github.event.schedule != '*/5 13-21 * * 1-5'
        continue-on-error: true
        run: python tools/calendar_collect.py
      - name: 공식 거시 데이터 수집 (재무부 금리·FRED, 시간 제한·재시도)
        if: github.event_name != 'schedule' || github.event.schedule != '*/5 13-21 * * 1-5'
        continue-on-error: true
        timeout-minutes: 12
        run: python tools/macro_collect.py
      - name: 새 영상 자동 분석 (RSS 로 발견 → 자막 분석, 막히면 우회 없이 제목 분석)
        if: github.event_name != 'schedule' || github.event.schedule != '*/5 13-21 * * 1-5'
        continue-on-error: true
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          VIDEO: ${{ github.event.inputs.video }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
        run: |
          pip install -q yt-dlp
          python tools/youtube_update.py
      - name: 앱 버전 파일 생성 (코드가 바뀐 때만 값이 바뀜 → 설치된 앱이 스스로 새로고침)
        run: |
          V=$(cat index.html app.js engine.js bt-worker.js styles.css sw.js guide.html manifest.webmanifest | sha256sum | cut -c1-12)
          echo "{\"v\":\"$V\"}" > version.json
      - name: 개인정보·비밀 점검 후 배포 파일 정리
        run: |
          python tools/privacy_check.py
          mkdir -p _site
          cp -r index.html guide.html styles.css app.js engine.js bt-worker.js knowledge.js sw.js version.json manifest.webmanifest icon.svg icon-180.png icon-192.png icon-512.png icon-maskable-512.png data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
