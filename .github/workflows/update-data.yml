name: 자동 갱신 + 배포
# PC·Claude 없이 동작: GitHub 가 시세(5분마다·미국 장중)와 거물 거래(30분마다)를 수집해 GitHub Pages 에 배포합니다.
# 비밀 값(SEC 연락처, FMP 키)은 저장소 Settings → Secrets 에만 두며 사이트/코드에는 포함되지 않습니다.
on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'     # 시세만(최단 주기 5분, GitHub 지연 가능)
    - cron: '7,37 12-23 * * 1-5'    # 시세 + 거물 거래(SEC·13F·의원)
    - cron: '0 6 * * *'             # 하루 한 번 전체 재수집
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 시세·재무 수집 (매일 06시·수동 실행만 전체 이력, 나머지는 직전 배포본 위에 증분 갱신)
        continue-on-error: ${{ github.event_name == 'push' }}   # 코드 수정 배포는 시세 수집 실패와 무관하게 진행(직전 배포본 데이터를 이어받는다)
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 6 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/update_data.py --full
          else
            python tools/update_data.py
          fi
      - name: 거물 거래 수집 (SEC 가 제한하면 우회하지 않고 이전 데이터 유지)
        if: github.event_name != 'schedule' || github.event.schedule != '*/5 13-21 * * 1-5'
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python tools/tracker_collect.py
      - name: 경제 일정 수집 (연준·노동통계국 공식 일정)
        if: github.event_name != 'schedule' || github.event.schedule != '*/5 13-21 * * 1-5'
        continue-on-error: true
        run: python tools/calendar_collect.py
      - name: 공식 거시 데이터 수집 (재무부 금리·FRED, 시간 제한·재시도)
        if: github.event_name != 'schedule' || github.event.schedule != '*/5 13-21 * * 1-5'
        continue-on-error: true
        timeout-minutes: 12
        run: python tools/macro_collect.py
      - name: 포지션·수급 수집 (옵션·선물·공매도·기관·투자자별, 하루 1회 · 접근 제한 시 이전 데이터 유지)
        if: github.event_name != 'schedule' || github.event.schedule != '*/5 13-21 * * 1-5'
        continue-on-error: true
        timeout-minutes: 12
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python tools/position_collect.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: 앱 버전 파일 생성 (코드가 바뀐 때만 값이 바뀜 → 설치된 앱이 스스로 새로고침)
        run: |
          V=$(cat index.html app.js detail.js weekend.js positions.js engine.js bt-worker.js styles.css sw.js guide.html manifest.webmanifest | sha256sum | cut -c1-12)
          echo "{\"v\":\"$V\"}" > version.json
      - name: 수집 데이터 JSON 무결성 확인(깨진 파일이 있으면 배포하지 않음)
        run: python tools/validate_data.py
      - name: 개인정보·비밀 점검 후 배포 파일 정리
        run: |
          python tools/privacy_check.py
          mkdir -p _site
          cp -r index.html guide.html styles.css app.js detail.js weekend.js positions.js engine.js bt-worker.js sw.js version.json manifest.webmanifest icon.svg icon-180.png icon-192.png icon-512.png icon-maskable-512.png data _site/
          find _site -name '*.tmp' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        continue-on-error: true      # GitHub 쪽 아티팩트 조회 지연(일시 오류)은 한 번 더 시도
        uses: actions/deploy-pages@v4
      - name: 배포 일시 오류면 1분 뒤 재시도
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
